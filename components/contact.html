<!-- CONTACT component — mirrors the contact/apply markup used in index.html -->
<section class="contact" id="contact">
  <div class="container">
    <span class="eyebrow">Apply</span>
    <h2 class="section-title">Start Your Application Today</h2>
    <p class="section-sub">Fill out the form below and our team will reach out within 24 hours</p>

    <form class="apply-form" id="applyForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="John Smith" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 555 123 4567" required>
        </div>
        <div class="form-group">
          <label for="country">Passport Country</label>
          <select id="country" name="country" required>
            <option value="" disabled selected>Select your country</option>
            <option>United States</option>
            <option>United Kingdom</option>
            <option>Canada</option>
            <option>Australia</option>
            <option>Germany</option>
            <option>France</option>
            <option>Italy</option>
            <option>Spain</option>
            <option>Netherlands</option>
            <option>Ireland</option>
            <option>New Zealand</option>
            <option>Japan</option>
            <option>South Korea</option>
            <option>Singapore</option>
            <option>United Arab Emirates</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="packageSelect">Visa Package</label>
          <select id="packageSelect" name="package" required>
            <option value="30-Day Tourist">30-Day Tourist Visa — $999</option>
            <option value="10-Year Business" selected>10-Year Multiple Entry Business Visa — $1,899.98</option>
          </select>
        </div>
        <div class="form-group">
          <label for="travelDate">Travel Date</label>
          <input type="date" id="travelDate" name="travelDate">
        </div>
      </div>

      <div class="form-group full">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Tell us anything else about your trip..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">Submit My Application</button>

      <p class="form-success" id="formSuccess" role="status" hidden>✅ Thank you! Your application has been received. Our team will contact you within 24 hours.</p>
    </form>

    <p class="contact-info">📞 WhatsApp: <a href="https://wa.me/201555049381" target="_blank" rel="noopener">+20 155 504 9381</a> &nbsp;|&nbsp; 📧 <a href="mailto:support@visagatesaudi.com">support@visagatesaudi.com</a></p>
  </div>
</section>
